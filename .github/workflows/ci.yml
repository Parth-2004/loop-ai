# CI for Loop AI — the required check. Nothing merges into main unless this passes.
# Backend: FastAPI (app/), frontend: React + Vite (client/).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ---------- Frontend (client/) ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Lint client (if a lint script exists)
        working-directory: client
        run: npm run lint --if-present

      - name: Build client
        working-directory: client
        run: npm run build

      # ---------- Backend (app/) ----------
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint backend (syntax errors and undefined names)
        run: ruff check app --select E9,F63,F7,F82

      - name: Backend compiles
        run: python -m compileall -q app

      - name: App starts (import smoke test)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python -c "import app.main; print('app imported OK')"

      - name: Tests (if any)
        env:
          DATABASE_URL: sqlite:///./ci.db
        # exit code 5 = no tests collected yet
        run: pytest -q || [ $? -eq 5 ]
