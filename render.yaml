# Render Blueprint — deploy with: Render Dashboard → New → Blueprint → select this repo.
# Creates the web service (Docker: builds the React dashboard, runs FastAPI) and a PostgreSQL database.
services:
  - type: web
    name: loop-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The scheduler runs inside the web process, so the service must not sleep:
    # use "starter" or above (free instances spin down after 15 min of inactivity).
    plan: starter
    # Keep one instance: a second one would run the scheduler twice.
    numInstances: 1
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: loop-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # --- Gemini (required) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: GEMINI_VIDEO_MODEL
        value: veo-3.0-fast-generate-001
      # --- Email (Resend recommended on Render) ---
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # --- Social apps ---
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false

databases:
  - name: loop-ai-db
    plan: basic-256mb
    databaseName: loop_ai
